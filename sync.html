<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0F">
<title>sync</title>
<style>
:root{
  --bg:#0A0A0F; --surface:#15151E; --raised:#1E1E2A;
  --line:#2A2A38; --text:#E4E4EC; --dim:#7B7B90;
  --yellow:#FFD84D; --cyan:#4DD8FF; --green:#5BE87F; --red:#FF6B6B;
  --mono:ui-monospace,"JetBrains Mono","Roboto Mono","DejaVu Sans Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation}
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:15px;line-height:1.45;
  padding:12px 12px calc(12px + env(safe-area-inset-bottom));
  max-width:560px;margin:0 auto;
}
.eyebrow{
  font:600 10px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);
}

/* ---- header ---- */
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.brand{font:700 15px/1 var(--mono);letter-spacing:.1em;color:var(--yellow)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.dot.live{background:var(--green);box-shadow:0 0 8px var(--green)}
.dot.err{background:var(--red)}
.seg{display:flex;margin-left:auto;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{
  background:transparent;border:0;color:var(--dim);font:600 12px/1 var(--sans);
  padding:8px 14px;cursor:pointer;
}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--text)}

/* ---- panels ---- */
.panel{
  background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:14px;margin-bottom:10px;
}
.now{font:600 14px/1.3 var(--sans);color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font:400 12px/1.4 var(--sans);color:var(--dim);margin-top:3px}

/* ---- timecode ---- */
.clock{display:flex;align-items:baseline;gap:10px;justify-content:center;padding:4px 0}
.tc{font:700 32px/1 var(--mono);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.tc .frac{color:var(--dim);font-size:20px}

/* ---- signature: de ondertitel zoals hij op het scherm staat ---- */
.tele{
  background:#000;border:1px solid var(--line);border-radius:8px;
  min-height:88px;display:flex;align-items:center;justify-content:center;
  padding:14px 12px;text-align:center;
}
.tele p{
  font:700 17px/1.5 var(--mono);color:var(--yellow);
  letter-spacing:.01em;white-space:pre-wrap;
}
.tele p.gap{color:#3A3A48;font-weight:400;letter-spacing:.16em;font-size:12px}

/* ---- offset ---- */
.offset{display:flex;align-items:center;justify-content:space-between;gap:12px}
.offset .val{font:700 26px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--dim)}
.offset .val.on{color:var(--cyan)}

/* ---- knoppen ---- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid.six{grid-template-columns:repeat(6,1fr)}
button.nudge{
  background:var(--raised);border:1px solid var(--line);border-radius:8px;
  color:var(--text);font:600 15px/1 var(--mono);
  min-height:56px;cursor:pointer;padding:0 2px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-variant-numeric:tabular-nums;
}
button.nudge i{font:400 9px/1 var(--mono);font-style:normal;
  letter-spacing:.06em;opacity:.55}
@media (max-width:400px){
  button.nudge{font-size:13px}
  button.nudge i{font-size:8px}
}
button.nudge:active{background:#2A2A3C;border-color:var(--cyan)}
button.nudge.minus{color:var(--cyan)}
button.nudge.plus{color:var(--yellow)}
.grid.four{grid-template-columns:repeat(4,1fr)}
button.act{
  background:var(--raised);border:1px solid var(--line);border-radius:8px;
  color:var(--text);font:600 13px/1 var(--sans);min-height:48px;cursor:pointer;
}
button.act:disabled{opacity:.35;cursor:default}
button.act.primary{background:var(--yellow);border-color:var(--yellow);color:#0A0A0F}
button.act.primary:disabled{background:var(--raised);border-color:var(--line);color:var(--text)}
button.act:active:not(:disabled){filter:brightness(1.15)}

/* ---- scope ---- */
.scope{display:flex;gap:8px;margin-bottom:10px}
.scope button{
  flex:1;background:transparent;border:1px solid var(--line);border-radius:8px;
  color:var(--dim);font:600 12px/1.3 var(--sans);padding:10px 6px;cursor:pointer;
}
.scope button[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan);background:#101824}
.scope small{display:block;font-weight:400;font-size:10px;opacity:.7;margin-top:2px}

/* ---- framerate ---- */
details.fps{padding:0}
details.fps summary{padding:14px}
details.fps[open] summary{border-bottom:1px solid var(--line)}
#fpsHint{font:400 10px/1 var(--mono);color:var(--cyan);letter-spacing:0;
  text-transform:none;margin-left:6px}
.fpsGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 14px 0}
.fpsGrid label{font:600 10px/1 var(--sans);letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);display:block}
.fpsGrid select{width:100%;margin-top:6px}
.fpsFoot{display:flex;align-items:center;gap:10px;padding:12px 14px}
.fpsFoot .act{flex:none;padding:0 18px}
.factor{flex:1;font:700 20px/1 var(--mono);font-variant-numeric:tabular-nums;
  color:var(--dim)}
.factor.on{color:var(--cyan)}
.fpsNote{font:400 11px/1.4 var(--sans);color:var(--dim);padding:0 14px 14px}

/* ---- cue list ---- */
details summary{
  cursor:pointer;list-style:none;padding:10px 0;
  font:600 11px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
}
details summary::-webkit-details-marker{display:none}
.cues{max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:8px}
.cue{display:flex;gap:10px;padding:8px 10px;border-bottom:1px solid #20202C;cursor:pointer}
.cue:last-child{border-bottom:0}
.cue .n{font:400 11px/1.6 var(--mono);color:#454558;min-width:30px;text-align:right}
.cue .t{font:400 11px/1.6 var(--mono);color:var(--dim);white-space:nowrap}
.cue .x{font:400 12px/1.5 var(--sans);color:var(--text);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;flex:1}
.cue.here{background:#1A1A26}
.cue.here .x{color:var(--yellow)}
.cue.moved .t{color:var(--cyan)}

/* ---- bladeren ---- */
.row{display:flex;gap:8px;margin-bottom:8px}
input[type=text],select{
  flex:1;background:var(--bg);border:1px solid var(--line);border-radius:8px;
  color:var(--text);font:400 13px/1 var(--mono);padding:11px 10px;min-width:0;
}
audio{width:100%;margin-top:8px}
.list{max-height:220px;overflow-y:auto;margin-top:8px}
.item{
  border-bottom:1px solid #20202C;padding:10px 8px;cursor:pointer;
  display:flex;align-items:center;gap:8px;
  border-left:2px solid transparent;
  font:400 13px/1.4 var(--sans);color:var(--text);
  user-select:none;-webkit-user-select:none;
}
.item .k{color:#454558;font-family:var(--mono);font-size:10px;
  letter-spacing:.08em;min-width:24px}
.item .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.item:hover .nm{color:var(--cyan)}
.item.sel{background:#101824;border-left-color:var(--cyan)}
.item.sel .nm{color:var(--cyan);font-weight:600}
.item.sel .k{color:var(--cyan)}
.item.open{background:#1A1A26;border-left-color:var(--yellow)}
.item.open .nm{color:var(--yellow);font-weight:600}
.item.open .k{color:var(--yellow)}

/* ---- voortgang ---- */
.prog{padding:0 8px 10px;border-bottom:1px solid #20202C}
.prog .bar{height:4px;background:#20202C;border-radius:2px;overflow:hidden}
.prog .fill{height:100%;width:0;background:var(--cyan);transition:width .3s linear}
.prog.done .fill{background:var(--green)}
.prog.err .fill{background:var(--red);width:100%!important}
.prog .lbl{display:flex;justify-content:space-between;gap:8px;
  font:400 10px/1.6 var(--mono);color:var(--dim);margin-bottom:4px}
.prog .lbl b{font-weight:600;color:var(--cyan)}
.prog.err .lbl{color:var(--red)}

.toast{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  background:var(--raised);border:1px solid var(--line);border-radius:8px;
  padding:10px 16px;font:500 13px/1 var(--sans);
  opacity:0;pointer-events:none;transition:opacity .18s;z-index:10;
  max-width:90vw;text-align:center;
}
.toast.show{opacity:1}
.toast.err{border-color:var(--red);color:var(--red)}
.toast.ok{border-color:var(--green);color:var(--green)}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <span class="dot" id="dot"></span>
  <span class="brand">SYNC</span>
  <div class="seg" role="group">
    <button id="mTv" aria-pressed="true">TV</button>
    <button id="mLocal" aria-pressed="false">Lokaal</button>
  </div>
</header>

<!-- TV -->
<section id="tvBar" class="panel">
  <div class="now" id="nowName">Geen sessie</div>
  <div class="meta" id="nowMeta">Start een aflevering op je TV</div>
</section>

<!-- Lokaal -->
<section id="localBar" class="panel hide">
  <div class="eyebrow" style="margin-bottom:8px">Bestand</div>
  <div class="row">
    <input type="text" id="browsePath" value="/mnt/Serie" spellcheck="false">
    <button class="act" id="browseGo" style="min-height:auto;padding:0 14px">Open</button>
  </div>
  <div class="meta" id="browseHint">Tik om te kiezen, dubbeltik om te openen</div>
  <div class="list" id="browseList"></div>
  <audio id="audio" controls preload="metadata" class="hide"></audio>
</section>

<!-- ondertitelkeuze -->
<section class="panel" id="subBar">
  <div class="eyebrow" style="margin-bottom:8px">Ondertitel</div>
  <select id="subSel"><option value="">-</option></select>
</section>

<!-- klok + cue -->
<section class="panel">
  <div class="clock">
    <span class="tc" id="tc">00:00:00<span class="frac">,000</span></span>
  </div>
  <div class="tele" id="tele"><p class="gap">geen tekst</p></div>
</section>

<!-- offset -->
<section class="panel">
  <div class="offset">
    <span class="eyebrow">Verschuiving</span>
    <span class="val" id="offVal">0</span>
  </div>
</section>

<div class="scope">
  <button id="sHere" aria-pressed="true">Vanaf hier<small>deze cue en alles erna</small></button>
  <button id="sAll" aria-pressed="false">Alles<small>het hele bestand</small></button>
</div>

<div class="grid six" style="margin-bottom:10px">
  <button class="nudge minus" data-d="-1000">&minus;1<i>s</i></button>
  <button class="nudge minus" data-d="-500">&minus;500<i>ms</i></button>
  <button class="nudge minus" data-d="-100">&minus;100<i>ms</i></button>
  <button class="nudge plus" data-d="100">+100<i>ms</i></button>
  <button class="nudge plus" data-d="500">+500<i>ms</i></button>
  <button class="nudge plus" data-d="1000">+1<i>s</i></button>
</div>

<details class="panel fps" id="fpsBox">
  <summary>Framerate omzetten <span id="fpsHint"></span></summary>
  <div class="fpsGrid">
    <label>Van<select id="fpsFrom"></select></label>
    <label>Naar<select id="fpsTo"></select></label>
  </div>
  <div class="fpsFoot">
    <span class="factor" id="fpsFactor">&times;1,0000</span>
    <button class="act" id="bFps">Omzetten</button>
  </div>
  <div class="fpsNote">Werkt altijd op het hele bestand, verankerd op 00:00:00.</div>
</details>

<div class="grid four" style="margin-bottom:10px">
  <button class="act" id="bUndo" disabled>Ongedaan</button>
  <button class="act" id="bReset" disabled>Herstel</button>
  <button class="act" id="bReload">Herladen</button>
  <button class="act primary" id="bSave" disabled>Opslaan</button>
</div>

<details>
  <summary>Cues <span id="cueCount"></span></summary>
  <div class="cues" id="cueList"></div>
</details>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const S = {
  mode:'tv', scope:'here',
  session:null, subPath:null,
  base:[], cues:[], ops:[], dirty:false,
  pos:0, posAt:0, paused:true,
  selected:null,      // pad dat aangetikt is
  opened:null,        // pad dat geladen is
  jobKey:null, jobTimer:null,
  videoFps:null,
};

// ---------------------------------------------------------------- util
const tc = ms => {
  const neg = ms < 0; ms = Math.abs(Math.round(ms));
  const h = Math.floor(ms/3600000), m = Math.floor(ms%3600000/60000);
  const s = Math.floor(ms%60000/1000), f = ms%1000;
  const p = (n,w=2) => String(n).padStart(w,'0');
  return (neg?'-':'')+`${p(h)}:${p(m)}:${p(s)},${p(f,3)}`;
};
const signed = ms => (ms>0?'+':ms<0?'\u2212':'') + (Math.abs(ms)/1000).toFixed(3).replace('.',',');

let toastT;
function toast(msg, kind=''){
  const t = $('#toast');
  t.textContent = msg; t.className = 'toast show ' + kind;
  clearTimeout(toastT); toastT = setTimeout(()=>t.className='toast '+kind, 2600);
}
async function api(path, opts){
  const r = await fetch(path, opts);
  if(!r.ok){
    let d = await r.text();
    try{ d = JSON.parse(d).detail || d; }catch(e){}
    throw new Error(d);
  }
  return r.json();
}

// ---------------------------------------------------------------- cues
// S.base = zoals van schijf geladen. S.ops = de bewerkingen die je deed.
// S.cues wordt telkens opnieuw uit base + ops berekend. Zo kunnen verschuiven
// (optellen) en framerate omzetten (vermenigvuldigen) door elkaar staan.
function applyOps(){
  S.cues = S.base.map(c => ({...c}));
  for(const op of S.ops){
    if(op.type === 'shift'){
      for(let i=op.from;i<S.cues.length;i++){
        S.cues[i].start += op.delta; S.cues[i].end += op.delta;
      }
    } else if(op.type === 'scale'){
      for(let i=0;i<S.cues.length;i++){
        S.cues[i].start *= op.factor; S.cues[i].end *= op.factor;
      }
    }
  }
  S.dirty = S.ops.length > 0;
  listSig = '';
}
function anchorIndex(pos){
  for(let i=0;i<S.cues.length;i++) if(S.cues[i].end >= pos) return i;
  return -1;
}
function currentIndex(pos){
  for(let i=0;i<S.cues.length;i++){
    if(pos >= S.cues[i].start && pos <= S.cues[i].end) return i;
    if(S.cues[i].start > pos) return -1;
  }
  return -1;
}
function shift(delta){
  if(!S.cues.length){ toast('Laad eerst een ondertitel','err'); return; }
  const from = S.scope==='all' ? 0 : anchorIndex(livePos());
  if(from < 0){ toast('Geen cue vanaf deze positie','err'); return; }
  S.ops.push({type:'shift', from, delta});
  applyOps(); render();
}
function scale(factor){
  if(!S.cues.length){ toast('Laad eerst een ondertitel','err'); return; }
  if(!(factor > 0) || factor === 1){ toast('Van en naar zijn gelijk','err'); return; }
  S.ops.push({type:'scale', factor});
  applyOps(); render();
}
function undo(){
  if(!S.ops.pop()) return;
  applyOps(); render();
}
// Alles terug naar zoals van schijf geladen. Framerates raad je nu eenmaal,
// dus je wil er een paar kunnen proberen zonder stap voor stap terug te tikken.
function reset(){
  if(!S.ops.length) return;
  S.ops = [];
  applyOps(); render();
  toast('Terug naar het geladen bestand','ok');
}
// Verschil tussen nu en zoals-geladen. Werkt voor verschuiven en schalen.
const totalOffsetAt = i =>
  (S.base[i] ? S.cues[i].start - S.base[i].start : 0);

// ---------------------------------------------------------------- framerate
// Een cue hoort bij een frame, en frame N valt op N/fps. Getimed op `van` fps
// maar afgespeeld op `naar` fps betekent dus: nieuw = oud * (van / naar).
const FPS = [23.976, 24, 25, 29.97, 30, 50, 59.94, 60];
const fmtFps = v => String(v).replace('.', ',');

function fillFps(){
  ['#fpsFrom','#fpsTo'].forEach(id=>{
    const s = $(id);
    s.innerHTML = '';
    FPS.forEach(v=>{
      const o = document.createElement('option');
      o.value = v; o.textContent = fmtFps(v);
      s.appendChild(o);
    });
  });
  $('#fpsFrom').value = 25;
  $('#fpsTo').value = 23.976;
  fpsFactor();
}

function fpsFactor(){
  const from = parseFloat($('#fpsFrom').value);
  const to = parseFloat($('#fpsTo').value);
  const f = from / to;
  const el = $('#fpsFactor');
  el.textContent = '\u00d7' + f.toFixed(4).replace('.', ',');
  el.className = 'factor' + (Math.abs(f - 1) > 1e-9 ? ' on' : '');
  return f;
}

// Zet de doel-framerate op wat de video echt is.
async function loadFps(path){
  S.videoFps = null;
  $('#fpsHint').textContent = '';
  try{
    const d = await api('/api/video/info?path=' + encodeURIComponent(path));
    if(!d.fps) return;
    S.videoFps = d.fps;
    // Rond naar de dichtstbijzijnde bekende waarde, anders past de select niet.
    const near = FPS.reduce((a,b)=> Math.abs(b-d.fps) < Math.abs(a-d.fps) ? b : a);
    if(Math.abs(near - d.fps) < 0.05){
      $('#fpsTo').value = near;
      $('#fpsHint').textContent = 'video: ' + fmtFps(near);
    } else {
      $('#fpsHint').textContent = 'video: ' + fmtFps(d.fps) + ' (ongewoon)';
    }
    fpsFactor();
  }catch(e){ /* framerate is een luxe, geen blokkade */ }
}

// ---------------------------------------------------------------- positie
function livePos(){
  if(S.mode==='local'){
    const a = $('#audio');
    return a.src ? a.currentTime*1000 : 0;
  }
  if(!S.session) return 0;
  return S.paused ? S.pos : S.pos + (performance.now() - S.posAt);
}

// ---------------------------------------------------------------- render
function render(){
  const pos = livePos();
  const t = tc(pos);
  $('#tc').innerHTML = t.slice(0,8) + '<span class="frac">' + t.slice(8) + '</span>';

  const ci = currentIndex(pos);
  const tele = $('#tele');
  if(ci >= 0){
    tele.innerHTML = '<p></p>';
    tele.querySelector('p').textContent = S.cues[ci].text.replace(/<[^>]+>/g,'');
  } else tele.innerHTML = '<p class="gap">geen tekst</p>';

  const ai = S.scope==='all' ? 0 : anchorIndex(pos);
  const off = ai >= 0 ? totalOffsetAt(ai) : 0;
  const ov = $('#offVal');
  ov.textContent = off ? signed(off) : '0';
  ov.className = 'val' + (off ? ' on' : '');

  $('#bUndo').disabled = !S.ops.length;
  $('#bReset').disabled = !S.ops.length;
  $('#bSave').disabled = !S.dirty;
  $('#cueCount').textContent = S.cues.length ? `\u00b7 ${S.cues.length}` : '';
  renderList(ci);
}

let listSig = '';
function renderList(ci){
  const sig = S.cues.length + ':' + S.ops.length + ':' + ci;
  if(sig === listSig) return;
  listSig = sig;
  const box = $('#cueList');
  box.innerHTML = '';
  S.cues.forEach((c,i)=>{
    const d = document.createElement('div');
    d.className = 'cue' + (i===ci?' here':'') + (totalOffsetAt(i)?' moved':'');
    d.innerHTML = `<span class="n">${i+1}</span><span class="t">${tc(c.start).slice(0,8)}</span>`;
    const x = document.createElement('span');
    x.className = 'x'; x.textContent = c.text.replace(/\n/g,' ').replace(/<[^>]+>/g,'');
    d.appendChild(x);
    d.onclick = ()=> seekTo(c.start);
    box.appendChild(d);
  });
  const cur = box.querySelector('.here');
  if(cur) cur.scrollIntoView({block:'center'});
}

async function seekTo(ms){
  if(S.mode==='local'){
    const a = $('#audio');
    if(a.src) a.currentTime = ms/1000;
    return;
  }
  if(!S.session) return;
  try{
    await api('/api/player/seek',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({session_id:S.session.session_id, position_ms:Math.round(ms)})});
  }catch(e){ toast(e.message,'err'); }
}

// ---------------------------------------------------------------- ondertitels
async function loadSub(path){
  if(!path){ S.base=[]; S.cues=[]; S.ops=[]; S.dirty=false; S.subPath=null;
             listSig=''; render(); return; }
  try{
    const d = await api('/api/subtitle?path=' + encodeURIComponent(path));
    S.subPath = d.path; S.base = d.cues; S.ops = [];
    applyOps(); render();
    toast(`${d.cues.length} cues geladen`,'ok');
  }catch(e){ toast(e.message,'err'); }
}
function fillSubs(subs){
  const sel = $('#subSel');
  sel.innerHTML = '<option value="">-</option>';
  subs.forEach(s=>{
    const o = document.createElement('option');
    o.value = s.path; o.textContent = s.name;
    sel.appendChild(o);
  });
  if(subs.length === 1){ sel.value = subs[0].path; loadSub(subs[0].path); }
}

// ---------------------------------------------------------------- TV poll
let lastItem = null;
async function poll(){
  if(S.mode !== 'tv') return;
  try{
    const d = await api('/api/session');
    $('#dot').className = 'dot' + (d.playing ? ' live' : '');
    if(!d.playing){
      S.session = null; lastItem = null;
      $('#nowName').textContent = 'Geen sessie';
      $('#nowMeta').textContent = 'Start een aflevering op je TV';
      return;
    }
    S.session = d; S.pos = d.position_ms; S.posAt = performance.now(); S.paused = d.paused;
    $('#nowName').textContent = d.name;
    $('#nowMeta').textContent =
      `${d.device} \u00b7 ${d.paused?'gepauzeerd':'speelt'} \u00b7 spoor ${d.subtitle_index ?? '-'}`;
    if(d.item_id !== lastItem){
      lastItem = d.item_id;
      if(S.dirty) toast('Andere aflevering \u2014 niet-opgeslagen wijzigingen','err');
      else { S.base=[]; S.cues=[]; S.ops=[]; listSig=''; }
      fillSubs(d.subtitles);
      if(d.video_path) loadFps(d.video_path);
    }
  }catch(e){
    $('#dot').className = 'dot err';
    $('#nowMeta').textContent = e.message;
  }
}

// ---------------------------------------------------------------- bladeren
let entries = [];
async function browse(path){
  try{
    const d = await api('/api/browse?path=' + encodeURIComponent(path));
    $('#browsePath').value = d.path;
    S.selected = null;
    entries = [
      {kind:'dir', name:'..', path:d.parent},
      ...d.dirs.map(x=>({kind:'dir', ...x})),
      ...d.videos.map(x=>({kind:'vid', ...x})),
    ];
    drawList();
  }catch(e){ toast(e.message,'err'); }
}

// De lijst wordt enkel bij browse() opnieuw opgebouwd. Selecteren wisselt
// alleen klassen - anders vervangt een redraw het element tussen de twee
// klikken van een dubbelklik in, en vuurt dblclick nooit.
function drawList(){
  const box = $('#browseList');
  box.innerHTML = '';
  entries.forEach(e=>{
    const row = document.createElement('div');
    row.className = 'item';
    row.innerHTML = `<span class="k">${e.kind}</span>`;
    const nm = document.createElement('span');
    nm.className = 'nm'; nm.textContent = e.name;
    row.appendChild(nm);

    row.onclick = ()=>{ S.selected = e.path; paintList(); };
    row.ondblclick = ()=> openEntry(e);
    box.appendChild(row);
    e._row = row;
  });
  paintList();
}

function paintList(){
  entries.forEach(e=>{
    if(!e._row) return;
    e._row.classList.toggle('sel', S.selected === e.path);
    e._row.classList.toggle('open', S.opened === e.path);
  });
}

function progressRow(){
  const w = document.createElement('div');
  w.className = 'prog'; w.id = 'progRow';
  w.innerHTML = `<div class="lbl"><span id="progTxt">audio uitpakken</span>
    <b id="progPct">0%</b></div><div class="bar"><div class="fill" id="progFill"></div></div>`;
  return w;
}

function showProgressUnder(path){
  const old = $('#progRow');
  if(old) old.remove();
  const e = entries.find(x => x.path === path);
  if(e && e._row) e._row.after(progressRow());
}

function openEntry(e){
  if(e.kind === 'dir'){ browse(e.path); return; }
  S.opened = e.path;
  S.selected = e.path;
  paintList();
  $('#audio').classList.add('hide');
  $('#audio').removeAttribute('src');
  fillSubs(e.subtitles);
  showProgressUnder(e.path);
  loadFps(e.path);
  prepare(e.path);
}

// ---------------------------------------------------------------- uitpakken
async function prepare(path){
  clearInterval(S.jobTimer);
  try{
    const d = await api('/api/audio/prepare',{method:'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify({path})});
    S.jobKey = d.key;
    if(d.state === 'done'){ playAudio(d.key); setProg(100,'gereed','done'); return; }
    setProg(0, d.copy ? `${d.codec} \u2014 kopiëren` : `${d.codec} \u2192 aac hercoderen`);
    S.jobTimer = setInterval(()=>pollJob(d.key), 700);
  }catch(e){ toast(e.message,'err'); }
}

async function pollJob(key){
  try{
    const d = await api('/api/audio/progress?key=' + encodeURIComponent(key));
    if(d.state === 'error'){
      clearInterval(S.jobTimer);
      setProg(100, d.error || 'uitpakken mislukt', 'err');
      toast('Uitpakken mislukt','err');
      return;
    }
    setProg(d.percent, d.copy ? 'kopiëren' : 'hercoderen naar aac');
    if(d.state === 'done'){
      clearInterval(S.jobTimer);
      setProg(100, 'gereed', 'done');
      playAudio(key);
    }
  }catch(e){ clearInterval(S.jobTimer); }
}

function setProg(pct, txt, cls=''){
  const row = $('#progRow');
  if(!row) return;
  row.className = 'prog ' + cls;
  $('#progFill').style.width = pct + '%';
  $('#progPct').textContent = pct + '%';
  $('#progTxt').textContent = txt;
}

function playAudio(key){
  const a = $('#audio');
  a.classList.remove('hide');
  a.src = '/api/audio?key=' + encodeURIComponent(key);
}

// ---------------------------------------------------------------- events
$('#mTv').onclick = ()=> setMode('tv');
$('#mLocal').onclick = ()=> setMode('local');
function setMode(m){
  S.mode = m;
  $('#mTv').setAttribute('aria-pressed', m==='tv');
  $('#mLocal').setAttribute('aria-pressed', m==='local');
  $('#tvBar').classList.toggle('hide', m!=='tv');
  $('#localBar').classList.toggle('hide', m!=='local');
  $('#bReload').disabled = m!=='tv';
  if(m==='local'){ $('#dot').className='dot'; browse($('#browsePath').value); }
  else { $('#audio').pause(); poll(); }
}

$('#sHere').onclick = ()=> setScope('here');
$('#sAll').onclick = ()=> setScope('all');
function setScope(s){
  S.scope = s;
  $('#sHere').setAttribute('aria-pressed', s==='here');
  $('#sAll').setAttribute('aria-pressed', s==='all');
  render();
}

$('#fpsFrom').onchange = fpsFactor;
$('#fpsTo').onchange = fpsFactor;
$('#bFps').onclick = ()=> scale(fpsFactor());

document.querySelectorAll('button.nudge').forEach(b=>{
  b.onclick = ()=> shift(parseInt(b.dataset.d,10));
});
$('#bUndo').onclick = undo;
$('#bReset').onclick = reset;
$('#subSel').onchange = e => loadSub(e.target.value);
$('#browseGo').onclick = ()=> browse($('#browsePath').value);
$('#browsePath').onkeydown = e => { if(e.key==='Enter') browse(e.target.value); };

$('#bSave').onclick = async ()=>{
  if(!S.subPath || !S.dirty) return;
  $('#bSave').disabled = true;
  try{
    const d = await api('/api/subtitle/save',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({path:S.subPath, cues:S.cues.map(c=>({
        start:Math.round(c.start), end:Math.round(c.end), text:c.text}))})});
    // Wat op schijf staat is nu de nieuwe basis.
    S.base = S.cues.map(c=>({...c, start:Math.round(c.start), end:Math.round(c.end)}));
    S.ops = []; applyOps();
    toast(`Opgeslagen \u00b7 backup ${d.backup.split('/').pop()}`,'ok');
    render();
  }catch(e){ toast(e.message,'err'); $('#bSave').disabled = false; }
};

$('#bReload').onclick = async ()=>{
  if(!S.session){ toast('Geen sessie','err'); return; }
  if(S.dirty){ toast('Sla eerst op','err'); return; }
  try{
    await api('/api/player/reload',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({session_id:S.session.session_id,
        subtitle_index:S.session.subtitle_index, position_ms:Math.round(livePos())})});
    toast('Herladen gevraagd','ok');
  }catch(e){ toast(e.message,'err'); }
};

document.onkeydown = e => {
  if(e.target.tagName === 'INPUT') return;
  const k = {'ArrowLeft':-100,'ArrowRight':100,'ArrowDown':-1000,'ArrowUp':1000}[e.key];
  if(k){ e.preventDefault(); shift(k); }
  if(e.key === 'z' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); undo(); }
  if(e.key === ' ' && S.mode==='local'){
    e.preventDefault();
    const a = $('#audio'); if(a.src) a.paused ? a.play() : a.pause();
  }
  if(e.key === 'Enter' && S.mode==='local' && S.selected){
    const e2 = entries.find(x=>x.path===S.selected); if(e2) openEntry(e2);
  }
};
window.onbeforeunload = e => { if(S.dirty) return e.returnValue = 'Niet-opgeslagen wijzigingen'; };

setInterval(poll, 1000);
setInterval(render, 120);
fillFps(); poll(); render();
</script>
</body>
</html>
